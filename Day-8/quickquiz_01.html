<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quiz - 1</title>
</head>

<body>
    <h1>Quick Quiz - 1</h1>
    <form action="NULL">
        <div>
            <div>
                <label for="userName">Enter your NAME:</label>
            </div>
            <input type="text" name="userName" id="userName">
        </div>
        <div>
            <div>
                <label for="userCity">Enter your CITY:</label>
            </div>
            <input type="text" name="userCity" id="userCity">
        </div>
        <div>
            <div>
                <label for="userPinCode">Enter your PIN CODE:</label>
            </div>
            <input type="number" name="userPinCode" id="userPinCode">
        </div>
        <div>
            <input type="submit" value="SUBMIT">
            <input type="reset" value="RESET">
        </div>
    </form>
</body>

</html>
