<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Class Selector */
        .red{
            background-color: red;
        }

        /* ID Selector */
        #green{
            color: yellow;
            background-color: black;
        }

        /* Child Selector */
    </style>
</head>
<body>
    <div class="red">
        <h2>
            I am div with class red
        </h2>
    </div>
    <div id="green">
        <h2>
            I am another div with id green
        </h2>
    </div>
</body>
</html>
