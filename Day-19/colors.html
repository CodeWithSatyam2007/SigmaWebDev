<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <link rel="stylesheet" href="colors.css">
</head>

<body>
    <h1>About Colors</h1>
    <p class="heading">Color can be represented in:</p>
    <ol>
        <li>
            Color Keywords
            <p class="color-keywords">I am Color Keywords</p>
        </li>

        <li>Hex Color
            <p class="hex-color">I am Hex Color</p>
        </li>

        <li>RGB
            <p class="rgb">I am RGB</p>
        </li>

        <li>RGBA
            <p class="rgba">I am RGBA</p>
        </li>

        <li>HSl
            <p class="hsl">I am HSL</p>
        </li>
    </ol>
</body>

</html>
