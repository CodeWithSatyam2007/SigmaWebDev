<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- br tag is used to add line break -->
    <img width="500" src="wallpaper_spacecat_4k.jpg" alt="Wallpaper">
    <br>
    <table>
      <caption>Student Details</caption>
      <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Course</th>
      </tr>
      </thead>

      <tbody>
      <!-- colspan and rowspan is used with td like <td rowspan="_"></td> and <td colpan="_"></td> -->
      <tr>
        <td>Satyam</td>
        <td>18</td>
        <td>Web Development</td>
      </tr>
      <tr>
        <td>Harry</td>
        <td>27</td>
        <td>C++</td>
      </tr>
      </tbody>
      <tfoot>
        <tr>
        <td>Aman</td>
        <td>30</td>
        <td>Java</td>
      </tr>
      </tfoot>
    </table>
</body>
</html>
