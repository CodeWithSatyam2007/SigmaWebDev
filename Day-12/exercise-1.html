<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise-1</title>
</head>

<body>
    <!-- You are given 12 files; 6 audios and 6 video. Design a website using HTML only which shows these 12 files. files are in format - 1.mp3, 2.mp3, ... 6.mp3 and 1.mp4, 2/mp4, ... 6.mp4 -->
    <main>
        <div>
            <video width="500" src="1.mp4" controls></video>
            <video width="500" src="2.mp4" controls></video>
            <video width="500" src="3.mp4" controls></video>
            <video width="500" src="4.mp4" controls></video>
            <video width="500" src="5.mp4" controls></video>
            <video width="500" src="6.mp4" controls></video>
        </div>
        <div>
            <audio src="1.mp3" controls></audio>
            <audio src="2.mp3" controls></audio>
            <audio src="3.mp3" controls></audio>
            <audio src="4.mp3" controls></audio>
            <audio src="5.mp3" controls></audio>
            <audio src="6.mp3" controls></audio>
        </div>
    </main>
</body>

</html>
